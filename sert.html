<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TechnoDom — Бытовая техника</title>
  <style>
    :root { --primary: #2c3e50; --accent: #e67e22; --bg: #f4f7f6; --card: #ffffff; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: var(--bg); color: #333; }
    header { background: var(--primary); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: 1.5rem; }
    nav a { color: white; text-decoration: none; font-weight: 500; }
    main { max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
    h1, h2 { text-align: center; }
    .filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 0.8rem; margin-bottom: 1.5rem; }
    .filter-btn { padding: 8px 16px; border: 1px solid var(--primary); background: white; cursor: pointer; border-radius: 6px; }
    .filter-btn.active { background: var(--primary); color: white; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .product-card { background: var(--card); padding: 1rem; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    .product-price { font-size: 1.25rem; font-weight: bold; color: var(--primary); }
    .product-old-price { text-decoration: line-through; color: #999; margin-right: 0.5rem; font-size: 1rem; }
    button.buy-btn { width: 100%; padding: 10px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-top: 0.75rem; }
    button.buy-btn:hover { opacity: 0.9; }

    .cart-summary { background: var(--primary); color: white; padding: 1rem; text-align: center; margin-top: 2rem; border-radius: 8px; display: flex; justify-content: center; align-items: center; gap: 1.5rem; flex-wrap: wrap; }
    .cart-open-btn { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; }

    /* Общие модальные окна */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background: white; padding: 2rem; border-radius: 10px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; position: relative; }
    .modal h3 { margin-top: 0; text-align: center; }
    .close-modal { position: absolute; top: 12px; right: 16px; background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #666; }

    /* Окно выбора количества */
    .qty-controls { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin: 1rem 0; }
    .qty-btn { width: 36px; height: 36px; background: #eee; border: 1px solid #ccc; cursor: pointer; border-radius: 4px; font-size: 1.1rem; }
    .qty-input { width: 48px; text-align: center; padding: 6px 0; border: 1px solid #ccc; border-radius: 4px; }
    .confirm-qty-btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; width: 100%; }

    /* Корзина */
    .cart-item { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; border-bottom: 1px solid #eee; padding: 0.75rem 0; flex-wrap: wrap; }
    .cart-item-info { flex: 1; min-width: 140px; }
    .cart-item-name { font-weight: bold; }
    .cart-item-qty { display: flex; align-items: center; gap: 0.3rem; }
    .cart-item-qty .qty-btn { width: 28px; height: 28px; font-size: 0.9rem; }
    .cart-item-qty .qty-input { width: 40px; padding: 4px 0; }
    .cart-item-price { min-width: 90px; text-align: right; font-weight: bold; color: var(--primary); }
    .remove-btn { background: #e74c3c; color: white; border: none; border-radius: 4px; width: 30px; height: 30px; cursor: pointer; }
    .cart-total-row { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: bold; margin-top: 1rem; padding-top: 0.75rem; border-top: 2px solid var(--primary); }
    .checkout-btn { width: 100%; margin-top: 1rem; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1.1rem; font-weight: bold; }
    .checkout-btn:disabled { background: #ccc; cursor: not-allowed; }
    .cart-empty { text-align: center; color: #888; padding: 1.5rem 0; }

    @media (max-width: 768px) {
      header { flex-direction: column; text-align: center; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" style="font-size: 1.5rem; font-weight: bold;">TechnoDom</div>
    <nav>
      <ul>
        <li><a href="#catalog">Каталог</a></li>
        <li><a href="#about">О нас</a></li>
        <li><a href="#contacts">Контакты</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="catalog">
      <h1>Бытовая техника</h1>
      <div class="filter-bar" id="filters">
        <button class="filter-btn active" data-filter="all">Все</button>
        <button class="filter-btn" data-filter="fridge">Холодильники</button>
        <button class="filter-btn" data-filter="washing">Стиральные машины</button>
        <button class="filter-btn" data-filter="coffee">Кофемашины</button>
        <button class="filter-btn" data-filter="vacuum">Пылесосы</button>
        <button class="filter-btn" data-filter="microwave">Микроволновки</button>
        <button class="filter-btn" data-filter="cooker">Мультиварки</button>
      </div>
      <div class="products-grid" id="products"></div>
    </section>

    <section id="about" style="margin-top: 3rem;">
      <h2>О нас</h2>
      <p>TechnoDom — ваш надёжный поставщик бытовой техники. Гарантия, быстрая доставка и честные цены.</p>
    </section>

    <section id="contacts" style="margin-top: 3rem;">
      <h2>Контакты</h2>
      <p>Телефон: +7 (999) 000-00-00<br>Email: info@technodom.ru</p>
    </section>

    <div class="cart-summary">
      <span>В корзине: <strong id="cart-count">0</strong> шт. на сумму <strong id="cart-total">0 ₽</strong></span>
      <button class="cart-open-btn" onclick="openCartModal()">🛒 Открыть корзину</button>
    </div>
  </main>

  <!-- Модальное окно выбора количества -->
  <div class="modal-overlay" id="qtyModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('qtyModal')">&times;</button>
      <h3 id="modal-product-name">Товар</h3>
      <p id="modal-product-price" style="text-align:center;">Цена</p>
      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty(-1)">−</button>
        <input type="number" id="modal-qty" class="qty-input" value="1" min="1" max="10" readonly />
        <button class="qty-btn" onclick="changeQty(1)">+</button>
      </div>
      <button class="confirm-qty-btn" onclick="confirmAddToCart()">Добавить в корзину</button>
    </div>
  </div>

  <!-- Модальное окно корзины -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal">
      <button class="close-modal" onclick="closeModal('cartModal')">&times;</button>
      <h3>🛒 Корзина</h3>
      <div id="cart-items"></div>
      <div class="cart-total-row">
        <span>Итого:</span>
        <span id="cart-modal-total">0 ₽</span>
      </div>
      <button class="checkout-btn" id="checkout-btn" onclick="checkout()" disabled>Оформить заказ</button>
    </div>
  </div>

  <script>
    // Данные товаров
    const products = [
      { id: 1, name: "Холодильник FrostLine F100", category: "fridge", price: 39990, oldPrice: 45000, desc: "Энергоэффективный, No Frost, 300 л" },
      { id: 2, name: "Стиральная машина AquaWash S200", category: "washing", price: 24990, oldPrice: 28000, desc: "Загрузка 7 кг, 12 программ" },
      { id: 3, name: "Кофемашина BaristaHome C300", category: "coffee", price: 19990, oldPrice: 22000, desc: "Автоматическая, капучинатор, 15 бар" },
      { id: 4, name: "Пылесос TurboVac V400", category: "vacuum", price: 14990, oldPrice: 17000, desc: "Мощность 2000 Вт, HEPA-фильтр" },
      { id: 5, name: "Микроволновка QuickWave M500", category: "microwave", price: 8990, desc: "Объём 23 л, гриль, сенсорное управление" },
      { id: 6, name: "Мультиварка SmartCook C600", category: "cooker", price: 7990, desc: "15 программ, чаша 5 л, таймер" }
    ];

    let currentQty = 1;
    let currentProductId = null;
    let cart = []; // { id, qty }

    // Рендер товаров
    function renderProducts(filter = "all") {
      const container = document.getElementById("products");
      container.innerHTML = "";
      products.forEach(p => {
        if (filter !== "all" && p.category !== filter) return;
        const card = document.createElement("div");
        card.className = "product-card";
        card.innerHTML = `
          <h3>${p.name}</h3>
          <p>${p.desc}</p>
          <div class="product-price">
            ${p.oldPrice ? `<span class="product-old-price">${p.oldPrice.toLocaleString("ru-RU")} ₽</span>` : ""}
            ${p.price.toLocaleString("ru-RU")} ₽
          </div>
          <button class="buy-btn" onclick="openQtyModal(${p.id})">Купить</button>
        `;
        container.appendChild(card);
      });
    }

    // Фильтры
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", e => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        e.target.classList.add("active");
        renderProducts(e.target.dataset.filter);
      });
    });

    // Окно выбора количества
    function openQtyModal(id) {
      const product = products.find(p => p.id === id);
      if (!product) return;
      document.getElementById("modal-product-name").textContent = product.name;
      document.getElementById("modal-product-price").textContent = `${product.price.toLocaleString("ru-RU")} ₽`;
      currentQty = 1;
      currentProductId = id;
      document.getElementById("modal-qty").value = 1;
      document.getElementById("qtyModal").style.display = "flex";
    }

    function changeQty(delta) {
      currentQty = Math.max(1, Math.min(10, currentQty + delta));
      document.getElementById("modal-qty").value = currentQty;
    }

    function confirmAddToCart() {
      const existing = cart.find(item => item.id === currentProductId);
      if (existing) {
        existing.qty = Math.min(10, existing.qty + currentQty);
      } else {
        cart.push({ id: currentProductId, qty: currentQty });
      }
      updateCartSummary();
      closeModal("qtyModal");
      const product = products.find(p => p.id === currentProductId);
      alert(`Товар "${product.name}" добавлен в корзину (${currentQty} шт.)`);
    }

    // Корзина
    function openCartModal() {
      renderCart();
      document.getElementById("cartModal").style.display = "flex";
    }

    function renderCart() {
      const container = document.getElementById("cart-items");
      container.innerHTML = "";
      if (cart.length === 0) {
        container.innerHTML = `<div class="cart-empty">Корзина пуста. Добавьте товары из каталога 🙂</div>`;
      } else {
        cart.forEach(item => {
          const product = products.find(p => p.id === item.id);
          const row = document.createElement("div");
          row.className = "cart-item";
          row.innerHTML = `
            <div class="cart-item-info">
              <div class="cart-item-name">${product.name}</div>
              <div>${product.price.toLocaleString("ru-RU")} ₽ × ${item.qty} шт.</div>
            </div>
            <div class="cart-item-qty">
              <button class="qty-btn" onclick="changeCartItemQty(${item.id}, -1)">−</button>
              <input class="qty-input" value="${item.qty}" readonly />
              <button class="qty-btn" onclick="changeCartItemQty(${item.id}, 1)">+</button>
            </div>
            <div class="cart-item-price">${(product.price * item.qty).toLocaleString("ru-RU")} ₽</div>
            <button class="remove-btn" title="Удалить" onclick="removeFromCart(${item.id})">✕</button>
          `;
          container.appendChild(row);
        });
      }
      const total = cart.reduce((sum, item) => {
        const product = products.find(p => p.id === item.id);
        return sum + product.price * item.qty;
      }, 0);
      document.getElementById("cart-modal-total").textContent = `${total.toLocaleString("ru-RU")} ₽`;
      document.getElementById("checkout-btn").disabled = cart.length === 0;
    }

    function changeCartItemQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty = Math.max(1, Math.min(10, item.qty + delta));
      updateCartSummary();
      renderCart();
    }

    function removeFromCart(id) {
      cart = cart.filter(i => i.id !== id);
      updateCartSummary();
      renderCart();
    }

    function checkout() {
      if (cart.length === 0) return;
      alert("Заказ оформлен! Мы свяжемся с вами для уточнения деталей.");
      cart = [];
      updateCartSummary();
      renderCart();
      closeModal("cartModal");
    }

    // Сводка под каталогом
    function updateCartSummary() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const total = cart.reduce((sum, item) => {
        const product = products.find(p => p.id === item.id);
        return sum + product.price * item.qty;
      }, 0);
      document.getElementById("cart-count").textContent = totalQty;
      document.getElementById("cart-total").textContent = `${total.toLocaleString("ru-RU")} ₽`;
    }

    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    // Закрытие окон по клику на затемнение
    document.querySelectorAll(".modal-overlay").forEach(overlay => {
      overlay.addEventListener("click", e => {
        if (e.target === overlay) overlay.style.display = "none";
      });
    });

    // Инициализация
    renderProducts();
  </script>
</body>
</html>
